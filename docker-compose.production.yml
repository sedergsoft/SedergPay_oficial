services:
  backend:
    environment:
      SEDERG_AUTH_MODE: ${SEDERG_AUTH_MODE:-production}
      SEDERG_CLAMD_HOST: clamav
      SEDERG_CLAMD_PORT: 3310
      SEDERG_PII_KEY: ${SEDERG_PII_KEY:?SEDERG_PII_KEY is required in production}
      SEDERG_PRIVATE_STORAGE_PATH: /var/lib/sederg-private
      SEDERG_KYC_REQUIRED: ${SEDERG_KYC_REQUIRED:-1}
    ports: !reset []
    volumes: !reset
      - sederg_private_data:/var/lib/sederg-private
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8080/health') ? 0 : 1);"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
  clamav:
    ports: !reset []
    restart: unless-stopped
  postgres:
    ports: !reset []
    restart: unless-stopped
  redis:
    ports: !reset []
    restart: unless-stopped
  caddy:
    image: caddy:2-alpine
    environment:
      API_DOMAIN: ${API_DOMAIN:?API_DOMAIN is required}
      TLS_EMAIL: ${TLS_EMAIL:?TLS_EMAIL is required}
    ports: ["80:80","443:443"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
volumes:
  caddy_data:
  caddy_config:
  sederg_private_data:
