; KYC document uploads are capped at 5 MB by the application.
; PHP's default (2 MB / 8 MB) is lower than that and rejected valid
; documents before the controller could validate them.
upload_max_filesize = 8M
post_max_size = 10M
max_file_uploads = 20
max_execution_time = 120
max_input_time = 120
memory_limit = 256M
