; Ajustes de PHP para SEDERG_PAY
;
; Los limites por defecto de la imagen oficial (upload_max_filesize = 2M)
; rechazaban los documentos KYC de mas de 2 MB con un error confuso, aunque
; la aplicacion admita 5 MB (ver KycDocumentSecurity::validateAndScan).
; Se suben los limites con margen para lamultipart/form-data (boundary + headers)
; y se desactivan los warnings en pantalla: PHP avisaba antes de que Yii
; pudiera responder y rompia las cabeceras CORS de la respuesta.
upload_max_filesize = 6M
post_max_size = 10M
memory_limit = 256M
max_execution_time = 120
max_input_time = 120

; Los errores van al log, nunca a la respuesta HTTP (si no, el HTML del warning
; rompe el JSON que espera el frontend y ademas invalida las cabeceras CORS).
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr
