# =============================================================================
# SEDERG_PAY — stack de despliegue LOCAL autocontenido
#
# Uso (desde la raíz del repositorio):
#   docker compose --env-file .env -f deploy/local/docker-compose.local.yml up -d --build
#   docker compose --env-file .env -f deploy/local/docker-compose.local.yml \
#     run --rm backend php yii migrate --interactive=0
#
# URLs:
#   Frontend  -> http://localhost:5173
#   API       -> http://localhost:18080
#   Health    -> http://localhost:18080/health
#   Postgres  -> localhost:5432 (solo para inspección)
#
# Diferencias deliberadas con docker-compose.yml:
#   - Sin bind mount del código: la imagen es inmutable (reproduce producción).
#   - Sin Redis: el backend no lo usa (verificado en el código).
#   - Sin ClamAV: en local SEDERG_KYC_REQUIRED=0. Para probar adjuntos KYC,
#     usar el docker-compose.yml de la raíz.
# =============================================================================
name: sederg-pay-local

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${SEDERG_DB_NAME:-sederg_pay}
      POSTGRES_USER: ${SEDERG_DB_USER:-sederg_app}
      POSTGRES_PASSWORD: ${SEDERG_DB_PASSWORD:?SEDERG_DB_PASSWORD is required}
      PGDATA: /var/lib/postgresql/data/pgdata
    # Sin publicar en el host: la API accede por la red interna de Docker.
    # Para inspeccionar: docker compose ... exec postgres psql -U sederg_app -d sederg_pay
    volumes:
      - sederg_local_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SEDERG_DB_USER:-sederg_app} -d ${SEDERG_DB_NAME:-sederg_pay}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ../../backend
    restart: unless-stopped
    environment:
      SEDERG_DB_DSN: pgsql:host=postgres;port=5432;dbname=${SEDERG_DB_NAME:-sederg_pay}
      SEDERG_DB_USER: ${SEDERG_DB_USER:-sederg_app}
      SEDERG_DB_PASSWORD: ${SEDERG_DB_PASSWORD:?SEDERG_DB_PASSWORD is required}
      SEDERG_AUTH_MODE: ${SEDERG_AUTH_MODE:-development}
      SEDERG_ALLOW_DEV_HEADER_AUTH: ${SEDERG_ALLOW_DEV_HEADER_AUTH:-1}
      SEDERG_EXPOSE_AUTH_STATE: ${SEDERG_EXPOSE_AUTH_STATE:-1}
      SEDERG_DEBUG: ${SEDERG_DEBUG:-0}
      SEDERG_COOKIE_KEY: ${SEDERG_COOKIE_KEY:?SEDERG_COOKIE_KEY is required}
      SEDERG_PII_KEY: ${SEDERG_PII_KEY:?SEDERG_PII_KEY is required}
      SEDERG_ACCOUNT_ENCRYPTION_KEY: ${SEDERG_ACCOUNT_ENCRYPTION_KEY:?SEDERG_ACCOUNT_ENCRYPTION_KEY is required}
      SEDERG_PRIVATE_STORAGE_PATH: /var/lib/sederg-private
      SEDERG_KYC_REQUIRED: "0"
      # En local los correos se escriben en el log del contenedor en vez de
      # enviarse por SMTP. Para usar SMTP real: SEDERG_MAIL_TRANSPORT=smtp.
      SEDERG_MAIL_TRANSPORT: ${SEDERG_MAIL_TRANSPORT_LOCAL:-log}
      SEDERG_MAIL_HOST: ${SEDERG_MAIL_HOST:-smtp-relay.brevo.com}
      SEDERG_MAIL_PORT: ${SEDERG_MAIL_PORT:-2525}
      SEDERG_MAIL_ENCRYPTION: ${SEDERG_MAIL_ENCRYPTION:-tls}
      SEDERG_MAIL_USERNAME: ${SEDERG_MAIL_USERNAME:-}
      SEDERG_MAIL_PASSWORD: ${SEDERG_MAIL_PASSWORD:-}
      SEDERG_MAIL_FROM: ${SEDERG_MAIL_FROM:-no-reply@example.invalid}
      SEDERG_MAIL_API_URL: ${SEDERG_MAIL_API_URL:-}
      SEDERG_MAIL_API_KEY: ${SEDERG_MAIL_API_KEY:-}
      SEDERG_MAIL_API_KEY_HEADER: ${SEDERG_MAIL_API_KEY_HEADER:-api-key}
      SEDERG_MAIL_FROM_NAME: ${SEDERG_MAIL_FROM_NAME:-SEDERG_PAY}
      SEDERG_APP_URL: ${SEDERG_APP_URL:-http://localhost:5173}
      SEDERG_CORS_ORIGINS: ${SEDERG_CORS_ORIGINS:-http://localhost:5173}
      SEDERG_OIDC_ISSUER: ${SEDERG_OIDC_ISSUER:-https://identity.example.invalid/realms/sederg}
      SEDERG_OIDC_AUDIENCE: ${SEDERG_OIDC_AUDIENCE:-sederg-pay-api}
      SEDERG_OIDC_PUBLIC_KEY: ${SEDERG_OIDC_PUBLIC_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    ports: ["${SEDERG_BACKEND_PORT:-18080}:8080"]
    volumes:
      - sederg_local_private:/var/lib/sederg-private
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8080/health') ? 0 : 1);"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  frontend:
    build:
      context: ../../frontend
      args:
        VITE_AUTH_MODE: ${VITE_AUTH_MODE:-development}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports: ["${SEDERG_FRONTEND_PORT:-5173}:80"]

volumes:
  sederg_local_pg:
  sederg_local_private:
