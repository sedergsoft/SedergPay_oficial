name: Debug - list TiDB databases (temporary)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  list:
    runs-on: ubuntu-latest
    container: php:8.3-cli
    steps:
      - name: Install PostgreSQL driver
        run: |
          apt-get update
          apt-get install -y --no-install-recommends libpq-dev
          docker-php-ext-install pdo_pgsql
          rm -rf /var/lib/apt/lists/*

      - name: List databases
        env:
          SEDERG_DB_HOST: ${{ secrets.SEDERG_DB_HOST }}
          SEDERG_DB_PORT: ${{ secrets.SEDERG_DB_PORT }}
          SEDERG_DB_NAME: ${{ secrets.SEDERG_DB_NAME }}
          SEDERG_DB_USER: ${{ secrets.SEDERG_DB_USER }}
          SEDERG_DB_PASSWORD: ${{ secrets.SEDERG_DB_PASSWORD }}
        run: |
          php -derror_reporting=E_ERROR <<'EOPHP'
          <?php
          $host = getenv('SEDERG_DB_HOST');
          $port = getenv('SEDERG_DB_PORT') ?: '5432';
          $user = getenv('SEDERG_DB_USER');
          $pass = getenv('SEDERG_DB_PASSWORD');
          // Intento 1: sin dbname
          $candidates = ['', 'postgres', 'test', 'template1', getenv('SEDERG_DB_NAME')];
          foreach ($candidates as $db) {
            $dsn = "pgsql:host=$host;port=$port;sslmode=require";
            if ($db !== '') { $dsn .= ";dbname=$db"; }
            try {
              $pdo = new PDO($dsn, $user, $pass, [PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION, PDO::ATTR_TIMEOUT => 20]);
              echo "CONNECT_OK db=" . ($db === '' ? '(none)' : $db) . "\n";
              try {
                $rows = $pdo->query('SELECT datname FROM pg_database WHERE NOT datistemplate ORDER BY datname')->fetchAll(PDO::FETCH_COLUMN);
                echo "DATABASES: " . implode(' | ', $rows) . "\n";
              } catch (Throwable $e) {
                echo "LIST_FAIL: " . $e->getMessage() . "\n";
              }
              exit(0);
            } catch (Throwable $e) {
              echo "TRY db=" . ($db === '' ? '(none)' : $db) . " -> " . $e->getMessage() . "\n";
            }
          }
          echo "ALL_ATTEMPTS_FAILED\n";
          exit(1);
          EOPHP
