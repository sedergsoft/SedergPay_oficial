name: Deploy backend to free VM (opcional)

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'docker-compose*.yml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vm-deploy
  cancel-in-progress: false

jobs:
  backend:
    name: Deploy backend to free VM
    if: ${{ vars.VM_DEPLOY == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SSH key
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/sederg-pay
          chmod 600 ~/.ssh/sederg-pay
      - name: Deploy source and restart Docker stack
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_ENV: ${{ secrets.DEPLOY_ENV }}
        run: |
          if [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_USER" ] || [ -z "$DEPLOY_ENV" ]; then
            echo "::error::Faltan DEPLOY_HOST, DEPLOY_USER o DEPLOY_ENV."
            exit 1
          fi
          tar --exclude=.git --exclude=frontend/node_modules --exclude=backend/vendor -czf /tmp/sederg-pay.tar.gz .
          scp -o StrictHostKeyChecking=no -i ~/.ssh/sederg-pay /tmp/sederg-pay.tar.gz "$DEPLOY_USER@$DEPLOY_HOST:/tmp/sederg-pay.tar.gz"
          printf '%s\n' "$DEPLOY_ENV" | ssh -o StrictHostKeyChecking=no -i ~/.ssh/sederg-pay "$DEPLOY_USER@$DEPLOY_HOST" '
            set -eu
            mkdir -p "$HOME/sederg-pay"
            tar -xzf /tmp/sederg-pay.tar.gz -C "$HOME/sederg-pay"
            cd "$HOME/sederg-pay"
            umask 077
            cat > .env
            docker compose -f docker-compose.yml -f docker-compose.production.yml up -d --build postgres clamav
            docker compose -f docker-compose.yml -f docker-compose.production.yml run --rm backend php yii migrate --migrationPath=@app/migrations --interactive=0
            docker compose -f docker-compose.yml -f docker-compose.production.yml up -d --build backend caddy
          '
