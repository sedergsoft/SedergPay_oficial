name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Build SPA
        working-directory: frontend
        env:
          # Configurar en Settings → Secrets and variables → Actions → Variables
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_AUTH_MODE: ${{ vars.VITE_AUTH_MODE }}
          VITE_UI_PREVIEW: ${{ vars.VITE_UI_PREVIEW }}
        run: |
          if [ -z "$VITE_API_BASE_URL" ] && [ "$VITE_UI_PREVIEW" != "true" ]; then
            echo "::error::VITE_API_BASE_URL no está configurada. Define la variable del repo (Settings → Secrets and variables → Actions → Variables) o VITE_UI_PREVIEW=true para publicar solo la UI en modo development."
            exit 1
          fi
          : "${VITE_AUTH_MODE:=development}"
          if [ -z "$VITE_API_BASE_URL" ]; then
            echo "::warning::Publicando vista previa de la UI sin API real (VITE_AUTH_MODE=development)."
          fi
          VITE_AUTH_MODE="$VITE_AUTH_MODE" npm run build

      - name: SPA fallback (404.html)
        run: cp dist/index.html dist/404.html
        working-directory: frontend

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - id: deployment
        uses: actions/deploy-pages@v4
