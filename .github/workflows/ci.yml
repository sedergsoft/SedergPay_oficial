name: CI

on:
  pull_request:
    branches: [main, feature/admin-exchange-rate-source]
  push:
    branches: [feature/user-profile-beneficiaries-kyc]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: PHP syntax and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, openssl, pdo_mysql, fileinfo
          coverage: none
      - uses: actions/cache@v4
        with:
          path: backend/vendor
          key: composer-${{ runner.os }}-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-
      - name: Install PHP dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist
      - name: PHP syntax check
        run: find backend -path backend/vendor -prune -o -name '*.php' -type f -print0 | xargs -0 -n1 php -l
      - name: Run PHPUnit
        working-directory: backend
        run: vendor/bin/phpunit -c phpunit.xml

  frontend:
    name: TypeScript and Vite production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build
