name: CI

on:
  pull_request:
    branches: [main, feature/postgresql-migration]
  push:
    branches: [feature/postgresql-migration]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: PHP syntax and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, openssl, pdo_pgsql, fileinfo
          coverage: none
      - uses: actions/cache@v4
        with:
          path: backend/vendor
          key: composer-${{ runner.os }}-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-
      - name: Install PHP dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist
      - name: PHP syntax check
        run: |
          find backend -path backend/vendor -prune -o -name '*.php' -type f -print0 | xargs -0 -n1 php -l
          php -l scripts/db-migration/migrate-mysql-to-postgres.php
      - name: Run PHPUnit
        working-directory: backend
        run: vendor/bin/phpunit -c phpunit.xml

  postgres-integration:
    name: PostgreSQL migrations and remittance integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: sederg_app
          POSTGRES_PASSWORD: root
          POSTGRES_DB: sederg_pay
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U sederg_app -d sederg_pay"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, openssl, pdo_pgsql, fileinfo
          coverage: none
      - name: Install PHP dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist
      - name: Apply all Yii migrations against PostgreSQL 17
        working-directory: backend
        env:
          SEDERG_DB_DSN: pgsql:host=127.0.0.1;port=5432;dbname=sederg_pay
          SEDERG_DB_USER: sederg_app
          SEDERG_DB_PASSWORD: root
        run: |
          php yii migrate --interactive=0
          php yii migrate/down 1 --interactive=0
          php yii migrate --interactive=0
      - name: Verify critical schema objects and PostgreSQL trigger
        env:
          DB_HOST: 127.0.0.1
          DB_USER: sederg_app
          DB_PASSWORD: root
          DB_NAME: sederg_pay
        run: |
          php -r '$pdo=new PDO("pgsql:host=".getenv("DB_HOST").";dbname=".getenv("DB_NAME"),getenv("DB_USER"),getenv("DB_PASSWORD")); $tables=["users","user_profiles","beneficiaries","kyc_cases","kyc_documents","audit_logs","remittances","platform_funding_accounts"]; foreach($tables as $table){$q=$pdo->prepare("SELECT to_regclass(?)");$q->execute(["public.".$table]);if(!$q->fetchColumn()){fwrite(STDERR,"Missing table: $table\\n");exit(1);}} $q=$pdo->prepare("SELECT 1 FROM pg_trigger WHERE tgname = ? AND NOT tgisinternal"); $q->execute(["trg_users_updated_at"]); if(!$q->fetchColumn()){fwrite(STDERR,"Missing updated_at trigger\\n");exit(1);} echo "Critical PostgreSQL tables and triggers verified.\\n";'

      - name: Run quote and remittance HTTP integration tests
        working-directory: backend
        env:
          SEDERG_DB_DSN: pgsql:host=127.0.0.1;port=5432;dbname=sederg_pay
          SEDERG_DB_USER: sederg_app
          SEDERG_DB_PASSWORD: root
          SEDERG_AUTH_MODE: development
          SEDERG_COOKIE_KEY: ci-integration-cookie-key-long-enough-for-tests
          SEDERG_MAIL_TRANSPORT: array
          SEDERG_ACCOUNT_ENCRYPTION_KEY: ci-account-encryption-key-at-least-32-characters-long
        run: |
          php yii serve 127.0.0.1:8080 --docroot=web > /tmp/sederg-yii-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:8080/health >/dev/null; then break; fi
            sleep 1
          done
          curl --silent --fail http://127.0.0.1:8080/health >/dev/null || { cat /tmp/sederg-yii-server.log; exit 1; }
          php tests/integration/quote_flow_smoke.php

  deployment-config:
    name: Docker Compose production configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate development, production and migration Compose merges
        env:
          SEDERG_DB_PASSWORD: ci-test-db-password
          SEDERG_MYSQL_ROOT_PASSWORD: ci-test-mysql-root-password
          SEDERG_MYSQL_VOLUME: sederg_pay_sederg_mysql_data
          SEDERG_COOKIE_KEY: ci-test-cookie-key-long-enough-for-compose-validation
          SEDERG_PII_KEY: ci-test-pii-key-long-enough-for-compose-validation-0001
          SEDERG_ACCOUNT_ENCRYPTION_KEY: ci-test-account-encryption-key-long-enough-for-compose-validation
          API_DOMAIN: sederg.example.invalid
          TLS_EMAIL: ci@example.invalid
        run: |
          docker compose -f docker-compose.yml -f docker-compose.production.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.migration.yml --profile migration config --quiet

  frontend:
    name: TypeScript and Vite production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build

  migration-tool-test:
    name: MySQL to PostgreSQL data migration fixture
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: sederg_migration_test
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: sederg_app
          POSTGRES_PASSWORD: root
          POSTGRES_DB: sederg_migration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U sederg_app -d sederg_migration_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, pdo_pgsql
          coverage: none
      - name: Prepare isolated source and target fixture databases
        run: php scripts/db-migration/test-fixture.php setup
        env:
          MYSQL_DSN: mysql:host=127.0.0.1;port=3307;dbname=sederg_migration_test;charset=utf8mb4
          MYSQL_USER: root
          MYSQL_PASSWORD: root
          PG_DSN: pgsql:host=127.0.0.1;port=5432;dbname=sederg_migration_test
          PG_USER: sederg_app
          PG_PASSWORD: root
      - name: Execute the real migration utility
        run: php scripts/db-migration/migrate-mysql-to-postgres.php
        env:
          MYSQL_DSN: mysql:host=127.0.0.1;port=3307;dbname=sederg_migration_test;charset=utf8mb4
          MYSQL_USER: root
          MYSQL_PASSWORD: root
          PG_DSN: pgsql:host=127.0.0.1;port=5432;dbname=sederg_migration_test
          PG_USER: sederg_app
          PG_PASSWORD: root
      - name: Verify migrated rows, seed reconciliation, types, foreign keys and sequences
        run: php scripts/db-migration/test-fixture.php check
        env:
          MYSQL_DSN: mysql:host=127.0.0.1;port=3307;dbname=sederg_migration_test;charset=utf8mb4
          MYSQL_USER: root
          MYSQL_PASSWORD: root
          PG_DSN: pgsql:host=127.0.0.1;port=5432;dbname=sederg_migration_test
          PG_USER: sederg_app
          PG_PASSWORD: root
