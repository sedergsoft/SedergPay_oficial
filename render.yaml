# Blueprint de Render — SEDERG_PAY backend (free tier)
# Crear en Render → New → Blueprint → apuntar a sedergsoft/SedergPay_oficial
# Los valores `sync: false` se piden en el panel al crear (no van en Git).

services:
  - type: web
    name: sederg-pay-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: "10000"
      - key: SEDERG_DB_DSN          # pgsql:host=<pgwire-host>;port=<port>;dbname=<db>;sslmode=require
        sync: false
      - key: SEDERG_DB_USER
        sync: false
      - key: SEDERG_DB_PASSWORD
        sync: false
      - key: SEDERG_AUTH_MODE
        value: development          # sandbox: identidad por X-User-Public-Id; produccion exige OIDC
      # SEDERG_OIDC_ISSUER / _AUDIENCE / _PUBLIC_KEY solo se usan con
      # SEDERG_AUTH_MODE=production. Anadirlos en el panel al pasar a produccion.
      - key: SEDERG_COOKIE_KEY
        generateValue: true
      - key: SEDERG_DEBUG
        value: "0"
      - key: SEDERG_PII_KEY
        generateValue: true
      - key: SEDERG_ACCOUNT_ENCRYPTION_KEY
        generateValue: true
      - key: SEDERG_PRIVATE_STORAGE_PATH
        value: /var/lib/sederg-private
      - key: SEDERG_KYC_REQUIRED
        value: "0"                  # sin ClamAV en Render Free (disco efimero, solo sandbox)
      - key: SEDERG_MAIL_TRANSPORT
        value: smtp                 # el backend solo admite smtp; 'log' rompe el registro
      - key: SEDERG_MAIL_PORT
        value: "587"
      - key: SEDERG_MAIL_ENCRYPTION
        value: tls
      - key: SEDERG_MAIL_HOST
        sync: false
      - key: SEDERG_MAIL_USERNAME
        sync: false
      - key: SEDERG_MAIL_PASSWORD
        sync: false
      - key: SEDERG_MAIL_FROM
        sync: false
      - key: SEDERG_APP_URL
        value: https://sedergsoft.github.io/SedergPay_oficial/
      - key: SEDERG_CORS_ORIGINS
        value: https://sedergsoft.github.io
