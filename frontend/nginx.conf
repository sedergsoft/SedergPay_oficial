server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Preserve the sandbox identity header required by UserAuthenticator.
        proxy_set_header X-User-Public-Id $http_x_user_public_id;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
