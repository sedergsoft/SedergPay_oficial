server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    # KYC documents are up to 5 MB; nginx defaults to 1 MB and would
    # reject valid uploads with a 413 before they reach the backend.
    client_max_body_size 10m;

    # Resolve the backend per request instead of at startup. nginx otherwise
    # aborts with "host not found in upstream" while the backend container is
    # still being created, and the portal stays down afterwards.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream http://backend:8080;

    location /api/ {
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Preserve the sandbox identity header required by UserAuthenticator.
        proxy_set_header X-User-Public-Id $http_x_user_public_id;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
