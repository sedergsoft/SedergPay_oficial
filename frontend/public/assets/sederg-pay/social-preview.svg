<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">SEDERG_PAY - Remesas entre Rusia y Cuba</title>
  <desc id="desc">Plataforma para gestionar remesas entre Rusia y Cuba con claridad, seguridad y trazabilidad.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06142B"/>
      <stop offset="55%" stop-color="#0D1B33"/>
      <stop offset="100%" stop-color="#0A3D62"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00C853"/>
      <stop offset="100%" stop-color="#2DD4BF"/>
    </linearGradient>
    <radialGradient id="glow1" cx="85%" cy="20%" r="35%">
      <stop offset="0%" stop-color="#00C853" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00C853" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="15%" cy="85%" r="40%">
      <stop offset="0%" stop-color="#2DD4BF" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#2DD4BF" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>
  <g opacity="0.12" stroke="#FFFFFF">
    <path d="M760 40c120 40 180 120 170 220s-110 170-230 190" fill="none" stroke-width="2"/>
    <path d="M820 10c140 50 210 150 190 270S880 470 740 500" fill="none" stroke-width="2"/>
    <circle cx="980" cy="315" r="210" fill="none" stroke-width="1.5"/>
  </g>

  <g transform="translate(90,110)">
    <rect x="0" y="0" rx="18" ry="18" width="74" height="74" fill="url(#accent)"/>
    <path d="M22 50 L38 24 L54 50 Z" fill="#06142B" opacity="0.95"/>
    <path d="M18 50 H56" stroke="#06142B" stroke-width="6" stroke-linecap="round"/>
    <text x="98" y="52" font-family="Inter, Manrope, Arial, sans-serif" font-size="54" font-weight="800" fill="#FFFFFF" letter-spacing="1">SEDERG_PAY</text>
  </g>

  <g transform="translate(90,250)">
    <text font-family="Manrope, Inter, Arial, sans-serif" font-size="64" font-weight="800" fill="#FFFFFF">
      <tspan x="0" y="0">Remesas entre</tspan>
      <tspan x="0" y="78">Rusia y Cuba</tspan>
    </text>
    <rect x="0" y="108" width="320" height="8" rx="4" fill="url(#accent)"/>
    <text x="0" y="168" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="500" fill="#D7E3F4">Claridad, seguridad y trazabilidad en cada envío.</text>
  </g>

  <g transform="translate(90,470)" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="600">
    <g>
      <rect x="0" y="0" rx="22" ry="22" width="250" height="54" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.18"/>
      <circle cx="28" cy="27" r="7" fill="#00C853"/>
      <text x="48" y="35" fill="#EAF2FF">Tasas transparentes</text>
    </g>
    <g transform="translate(270,0)">
      <rect x="0" y="0" rx="22" ry="22" width="210" height="54" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.18"/>
      <circle cx="28" cy="27" r="7" fill="#00C853"/>
      <text x="48" y="35" fill="#EAF2FF">Pago seguro</text>
    </g>
    <g transform="translate(500,0)">
      <rect x="0" y="0" rx="22" ry="22" width="280" height="54" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.18"/>
      <circle cx="28" cy="27" r="7" fill="#00C853"/>
      <text x="48" y="35" fill="#EAF2FF">Seguimiento en tiempo real</text>
    </g>
  </g>

  <g transform="translate(760,170)" filter="url(#shadow)">
