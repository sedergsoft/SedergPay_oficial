    <rect x="28" y="28" rx="14" ry="14" width="294" height="54" fill="#FFFFFF" fill-opacity="0.06"/>
    <text x="48" y="63" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#BFD3EA">Cotización</text>
    <circle cx="286" cy="55" r="6" fill="#00C853"/>
    <text x="240" y="62" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600" fill="#00C853">En vivo</text>

    <text x="28" y="132" font-family="Inter, Arial, sans-serif" font-size="20" fill="#9FB7D6">Envías</text>
    <text x="28" y="170" font-family="Manrope, Inter, Arial, sans-serif" font-size="40" font-weight="800" fill="#FFFFFF">10 000 RUB</text>
    <text x="28" y="214" font-family="Inter, Arial, sans-serif" font-size="20" fill="#9FB7D6">Recibe</text>
    <text x="28" y="252" font-family="Manrope, Inter, Arial, sans-serif" font-size="40" font-weight="800" fill="#00C853">— CUP</text>
    <rect x="28" y="270" rx="10" ry="10" width="294" height="10" fill="url(#accent)" opacity="0.9"/>
  </g>
