services:
  frontend:
    build:
      context: ./frontend
      args:
        VITE_AUTH_MODE: ${VITE_AUTH_MODE:-development}
    ports:
      - "5173:80"
    depends_on:
      - backend
  backend:
    build:
      context: ./backend
    environment:
      SEDERG_DB_DSN: mysql:host=mysql;dbname=sederg_pay
      SEDERG_DB_USER: ${SEDERG_DB_USER:-sederg_app}
      SEDERG_DB_PASSWORD: ${SEDERG_DB_PASSWORD:?SEDERG_DB_PASSWORD is required}
      SEDERG_AUTH_MODE: ${SEDERG_AUTH_MODE:-development}
      SEDERG_COOKIE_KEY: ${SEDERG_COOKIE_KEY:?SEDERG_COOKIE_KEY is required}
      SEDERG_DEBUG: ${SEDERG_DEBUG:-0}
      SEDERG_PII_KEY: ${SEDERG_PII_KEY:-sederg-local-development-pii-key-change-me-2026}
      SEDERG_PRIVATE_STORAGE_PATH: ${SEDERG_PRIVATE_STORAGE_PATH:-/var/lib/sederg-private}
      SEDERG_KYC_REQUIRED: ${SEDERG_KYC_REQUIRED:-0}
      SEDERG_CLAMD_HOST: clamav
      SEDERG_CLAMD_PORT: 3310
      SEDERG_MAIL_TRANSPORT: ${SEDERG_MAIL_TRANSPORT:-smtp}
      SEDERG_MAIL_HOST: ${SEDERG_MAIL_HOST:-}
      SEDERG_MAIL_PORT: ${SEDERG_MAIL_PORT:-587}
      SEDERG_MAIL_ENCRYPTION: ${SEDERG_MAIL_ENCRYPTION:-tls}
      SEDERG_MAIL_USERNAME: ${SEDERG_MAIL_USERNAME:-}
      SEDERG_MAIL_PASSWORD: ${SEDERG_MAIL_PASSWORD:-}
      SEDERG_MAIL_FROM: ${SEDERG_MAIL_FROM:-}
      SEDERG_APP_URL: ${SEDERG_APP_URL:-http://localhost:5173}
      SEDERG_OIDC_ISSUER: ${SEDERG_OIDC_ISSUER:-https://identity.example.invalid/realms/sederg}
      SEDERG_OIDC_AUDIENCE: ${SEDERG_OIDC_AUDIENCE:-sederg-pay-api}
      SEDERG_OIDC_PUBLIC_KEY: ${SEDERG_OIDC_PUBLIC_KEY:-}
      SEDERG_CORS_ORIGINS: ${SEDERG_CORS_ORIGINS:-http://localhost:5173}
    depends_on:
      mysql:
        condition: service_healthy
      clamav:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/app
      - sederg_private_data:/var/lib/sederg-private
    command: ["php", "yii", "serve", "0.0.0.0:8080", "--docroot=web"]
  clamav:
    image: clamav/clamav:stable
    restart: unless-stopped
    volumes:
      - clamav_database:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping=3"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

  rate-updater:
    build:
      context: ./backend
    environment:
      SEDERG_DB_DSN: mysql:host=mysql;dbname=sederg_pay
      SEDERG_DB_USER: ${SEDERG_DB_USER:-sederg_app}
      SEDERG_DB_PASSWORD: ${SEDERG_DB_PASSWORD:?SEDERG_DB_PASSWORD is required}
    depends_on:
      mysql:
        condition: service_healthy
    command: ["sh", "-c", "while true; do php yii rates/update || echo 'Exchange-rate refresh failed; retrying in 12 hours.' >&2; sleep 43200; done"]
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: sederg_pay
      MYSQL_USER: ${SEDERG_DB_USER:-sederg_app}
      MYSQL_PASSWORD: ${SEDERG_DB_PASSWORD:?SEDERG_DB_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${SEDERG_MYSQL_ROOT_PASSWORD:?SEDERG_MYSQL_ROOT_PASSWORD is required}
    ports:
      - "3306:3306"
    volumes:
      - sederg_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - sederg_redis_data:/data

volumes:
  sederg_mysql_data:
  sederg_redis_data:
  sederg_private_data:
  clamav_database:
