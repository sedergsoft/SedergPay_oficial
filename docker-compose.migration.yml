services:
  mysql-source:
    image: mysql:8.4
    profiles: ["migration"]
    restart: "no"
    environment:
      MYSQL_ROOT_PASSWORD: ${SEDERG_MYSQL_ROOT_PASSWORD:?Set the legacy MySQL root password in .env}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        if [ -f /migration-state/clone-complete ]; then
          echo "Verified migration copy already exists; reusing it."
        elif [ -z "$(ls -A /var/lib/mysql 2>/dev/null)" ]; then
          if [ ! -d /legacy-source/mysql ]; then
            echo "Legacy source volume does not look like a MySQL datadir; refusing to clone."
            exit 1
          fi
          echo "Cloning stopped MySQL volume into an isolated migration copy..."
          cp -a /legacy-source/. /var/lib/mysql/
          chown -R mysql:mysql /var/lib/mysql
          touch /migration-state/clone-complete
          echo "Clone complete."
        else
          echo "Migration copy is non-empty but has no completion marker; refusing to use a partial copy."
          exit 1
        fi
        exec docker-entrypoint.sh mysqld --skip-log-bin
    volumes:
      - legacy_mysql_data:/legacy-source:ro
      - legacy_mysql_migration_copy:/var/lib/mysql
      - legacy_mysql_migration_state:/migration-state
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot"]
      interval: 5s
      timeout: 10s
      retries: 60
      start_period: 60s

  db-migrator:
    build:
      context: ./scripts/db-migration
    profiles: ["migration"]
    restart: "no"
    environment:
      MYSQL_DSN: mysql:host=mysql-source;port=3306;dbname=sederg_pay;charset=utf8mb4
      MYSQL_USER: root
      MYSQL_PASSWORD: ${SEDERG_MYSQL_ROOT_PASSWORD:?Set the legacy MySQL root password in .env}
      PG_DSN: pgsql:host=postgres;port=5432;dbname=sederg_pay
      PG_USER: ${SEDERG_DB_USER:-sederg_app}
      PG_PASSWORD: ${SEDERG_DB_PASSWORD:?Set SEDERG_DB_PASSWORD in .env}
    depends_on:
      mysql-source: {condition: service_healthy}
      postgres: {condition: service_healthy}
volumes:
  legacy_mysql_data:
    external: true
    name: ${SEDERG_MYSQL_VOLUME:-sederg_pay_sederg_mysql_data}
  legacy_mysql_migration_copy:
  legacy_mysql_migration_state:
