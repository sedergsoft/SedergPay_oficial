services:
  mysql-source:
    image: mysql:8.4
    profiles: ["migration"]
    restart: "no"
    environment:
      MYSQL_ROOT_PASSWORD: ${SEDERG_MYSQL_ROOT_PASSWORD:?Set the legacy MySQL root password in .env}
    command: ["--read-only=ON", "--skip-log-bin"]
    volumes:
      - legacy_mysql_data:/var/lib/mysql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot"]
      interval: 5s
      timeout: 10s
      retries: 30
  db-migrator:
    build:
      context: ./scripts/db-migration
    profiles: ["migration"]
    restart: "no"
    environment:
      MYSQL_DSN: mysql:host=mysql-source;port=3306;dbname=sederg_pay;charset=utf8mb4
      MYSQL_USER: root
      MYSQL_PASSWORD: ${SEDERG_MYSQL_ROOT_PASSWORD:?Set the legacy MySQL root password in .env}
      PG_DSN: pgsql:host=postgres;port=5432;dbname=sederg_pay
      PG_USER: ${SEDERG_DB_USER:-sederg_app}
      PG_PASSWORD: ${SEDERG_DB_PASSWORD:?Set SEDERG_DB_PASSWORD in .env}
    depends_on:
      mysql-source: {condition: service_healthy}
      postgres: {condition: service_healthy}
volumes:
  legacy_mysql_data:
    external: true
    name: ${SEDERG_MYSQL_VOLUME:-sederg_pay_sederg_mysql_data}
